on:
  push:
    branches:
    - 'main'
    paths-ignore:
    - '**.md'
    - 'assets/**'
    - '.vscode/**'
    - '.devcontainer/**'
    - '.github/**'
jobs:
  scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '6.0.x'
      - name: Run the build of the zip outputs in the local git folder BinaryDownloads
        run: .\publishtobinariesfolder.cmd D:\a\azure-sdk-for-sap-odata\azure-sdk-for-sap-odata\BinaryDownloads
        shell: cmd  

      - name: Commit files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -a -m "Add new binaries"
      
      - name: Push changes
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
